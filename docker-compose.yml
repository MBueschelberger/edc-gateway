services:
  nginx:
    image: nginx:1.27.5-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    depends_on:
      - api
      - frontend
      # - keycloak

  api:
    image: ghcr.io/mbueschelberger/edc-gateway-api:latest
    build: .
    env_file: .env
    environment:
      K8S_IN_CLUSTER: "false"
      EDC_GATEWAY_POSTGRES_HOST: db
    volumes:
      - ${K8S_KUBE_CONIG_PATH}:/root/.kube/config:ro
    restart: always
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/mbueschelberger/edc-gateway-frontend:latest
    build:
      context: ./frontend
      args:
        # VITE_KEYCLOAK_URL: https://${KC_EXTERNAL_HOSTNAME:-localhost}/auth
        VITE_KEYCLOAK_URL: https://${KC_EXTERNAL_HOSTNAME:-localhost}
        VITE_KEYCLOAK_REALM: ${KC_REALM:-edc}
        VITE_KEYCLOAK_CLIENT_ID: ${KC_CLIENT_ID:-frontend}
    restart: always
    depends_on:
      - api
      # - keycloak

  # keycloak:
  #   image: quay.io/keycloak/keycloak:25.0.2
  #   command: start-dev --features=preview
  #   environment:
  #     KC_DB: postgres
  #     KC_DB_URL: jdbc:postgresql://keycloak-db/keycloak
  #     KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
  #     KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
  #     KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
