  #     KC_HTTP_RELATIVE_PATH: /auth
  #     KC_HOSTNAME_STRICT: "false"
  #     KC_HTTP_ENABLED: "true"
  #     KC_PROXY_HEADERS: xforwarded
  #     KC_HOSTNAME: https://${KC_EXTERNAL_HOSTNAME}/auth/
  #   depends_on:
  #     keycloak-db:
  #       condition: service_healthy

  # keycloak-db:
  #   image: postgres:16
  #   expose:
  #     - "5432"
  #   environment:
  #     POSTGRES_DB: keycloak
  #     POSTGRES_USER: ${KEYCLOAK_DB_USER}
  #     POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
  #   volumes:
  #     - keycloak-db-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -d keycloak"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${EDC_GATEWAY_POSTGRES_DB}
      POSTGRES_USER: ${EDC_GATEWAY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EDC_GATEWAY_POSTGRES_SECRET}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EDC_GATEWAY_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  keycloak-db-data:
